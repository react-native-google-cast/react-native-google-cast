buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/NitroGoogleCast+autolinking.gradle"
apply from: "./fix-prefab.gradle"

// NOTE: a Nitro library must NOT apply "com.facebook.react" — it has no React
// Native codegen specs (registration is via nitrogen + C++). Applying it without
// a codegenConfig makes the library regenerate the RN *core* codegen, which then
// clashes with the app/other libraries at dex merge (duplicate class).

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroGoogleCast_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroGoogleCast_" + name]).toInteger()
}

// Google Cast SDK version (overridable from the consuming app via
// ext.castFrameworkVersion). Confirm/pin in the v5 support matrix.
def castFrameworkVersion = rootProject.ext.has("castFrameworkVersion")
  ? rootProject.ext.get("castFrameworkVersion")
  : "22.0.0"

android {
  namespace "com.margelo.nitro.googlecast"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }

    // Instrumented test runner for the AnyMap-carrying converter parity suite.
    // AnyMap is JNI-backed and cannot run under Robolectric, so these tests
    // require a connected emulator or device (android/src/androidTest/).
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  // Robolectric harness for the struct↔GCK converter parity suite (Phase 2 / T1).
  // Covers AnyMap-free converters on the JVM; AnyMap-carrying types are exercised by
  // instrumented tests (androidTest) because AnyMap is JNI-backed.
  testOptions {
    unitTests {
      includeAndroidResources = true
      returnDefaultValues = true
    }
  }

  // Bundle the shared golden-fixture corpus as androidTest assets so the instrumented
  // suite can open them from the device without pushing files separately.
  sourceSets {
    androidTest {
      assets.srcDirs = ['../fixtures']
    }
  }

  // The androidTest APK pulls the shared RN/runtime .so files from BOTH this library's
  // externalNativeBuild output (library_jni) and react-android, so merging fails with
  // "2 files found with path lib/<abi>/<name>.so". These are the identical runtime libs from
  // each input, so pickFirst is safe (the library's own libNitro*.so are not duplicated).
  packaging {
    jniLibs {
      pickFirsts += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libreactnative.so",
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Nitro core
  implementation project(":react-native-nitro-modules")

  // Google Cast SDK
  implementation "com.google.android.gms:play-services-cast-framework:${castFrameworkVersion}"

  // Converter parity suite (Robolectric, JVM unit tests).
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.13"

  // Instrumented converter parity suite (androidTest) for AnyMap-carrying types.
  // AnyMap is JNI-backed; these tests require a connected emulator or device.
  androidTestImplementation "androidx.test.ext:junit:1.1.5"
  androidTestImplementation "androidx.test:runner:1.5.2"
  androidTestImplementation "androidx.test:rules:1.5.0"
}
