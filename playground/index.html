<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-native-google-cast — playground (web)</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>

    <!--
      Optional custom receiver, exactly as docs/getting-started/web.md documents
      it: set the options global BEFORE the loader script.

      The native playground points at EA48D3FC (this project's own published
      custom receiver) because the channel rows need a custom namespace. Web is
      left on the Default Media Receiver so the two are not silently coupled —
      uncomment to run the web channel rows against the same receiver the native
      side uses.
    -->
    <!--
    <script>
      window.__RNGoogleCastOptions = { receiverAppId: 'EA48D3FC' }
    </script>
    -->

    <!--
      The Cast Web Sender loader. The library completes the SDK's
      `__onGCastApiAvailable` handshake itself — do not call
      `cast.framework.CastContext.getInstance().setOptions()` here.
    -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
