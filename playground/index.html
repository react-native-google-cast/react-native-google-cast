<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-native-google-cast — playground (web)</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>

    <!--
      Custom receiver, exactly as docs/getting-started/web.md documents it: set
      the options global BEFORE the loader script.

      This MUST match the native playground's receiver (EA48D3FC — the project's
      own published custom receiver; see the Android manifest meta-data and the
      iOS GCKDiscoveryCriteria). It is not a nicety:

      `CHANNEL_PROBE_ENABLED` in probeFixtures.ts is true, so the app registers
      `urn:x-cast:com.reactnative.googlecast.probe` as soon as a session exists.
      A receiver that does not declare that namespace responds by tearing the
      session down. Pointed at the Default Media Receiver, this page reproduced
      the 2026-08-02 native finding exactly: both `loadMedia` calls RESOLVED and
      then the receiver went `idle / idleReason: error`, which reads as a broken
      media pipeline and is not one.

      So: receiver app id and CHANNEL_PROBE_ENABLED move together, on every
      platform. If you point this back at CC1AD845, set that flag false too.
    -->
    <script>
      window.__RNGoogleCastOptions = { receiverAppId: 'EA48D3FC' }
    </script>

    <!--
      The Cast Web Sender loader. The library completes the SDK's
      `__onGCastApiAvailable` handshake itself — do not call
      `cast.framework.CastContext.getInstance().setOptions()` here.
    -->
    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.web.tsx"></script>
  </body>
</html>
